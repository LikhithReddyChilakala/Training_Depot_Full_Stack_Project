spring.application.name=Fitness-Gear-Ecom

# --- View resolution (JSP) ---
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# --- Database ---
# createDatabaseIfNotExists=true means you do not have to run CREATE DATABASE
# yourself - the schema is created on first connect.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.url=jdbc:mysql://localhost:3306/fitness_gear?createDatabaseIfNotExists=true

# ddl-auto=update lets Hibernate create/evolve the schema from the entities.
# Switch to "validate" once the schema is stable in a real deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# --- Razorpay ---
# Test-mode keys from the Razorpay dashboard. Never commit real secrets —
# set these as environment variables in any real deployment.
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_YOUR_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:YOUR_KEY_SECRET}

# --- Email (order confirmations) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-depot-email@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:your-16-char-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# --- Server ---
server.port=4250

# --- Equipment image uploads ---
file.upload-dir=uploads/images/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB

# --- Seed data ---
# Creates one admin account and a starter equipment catalog on first run
# (only when the users table is empty). Change the admin password after
# first login in a real deployment.
depot.seed.enabled=true
depot.seed.admin-username=kadali@fitness.com
depot.seed.admin-password=wanderlust18013
